name: Build & Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_USE_MOCKS: 'true'
          VITE_NETWORK: 'testnet'
          VITE_WAX_RPC: 'https://wax.greymass.com'
          VITE_ZOT_CONTRACT: 'zot.token'
          VITE_FARMING_CONTRACT: 'zot.farming'
          VITE_FAUCET_CONTRACT: 'zot.faucet'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
